spring:
  application:
    name: test

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver # MySQL JDBC 드라이버 클래스 이름
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    database: mysql # 사용할 DB 유형 지정 (MySQL)
    database-platform: org.hibernate.dialect.MySQLDialect # Hibernate에서 사용할 MySQL 방언(dialect) 지정
    show-sql: true # 실행된 SQL 쿼리를 콘솔에 출력할지 여부
    hibernate:
      ddl-auto: update # 애플리케이션 실행 시 DB 스키마의 상태 설정
    properties:
      hibernate:
        format_sql: true # 출력되는 SQL 쿼리를 보기 좋게 포맷팅

  jwt:
    secret: ${JWT_SECRET}
    token:
      access-expiration-time: ${JWT_ACCESS_EXPIRATION}
      refresh-expiration-time: ${JWT_REFRESH_EXPIRATION}

  kakao:
    client:
      id: ${KAKAO_ID}
      secret: ${KAKAO_SECRET}
    uri:
      redirect: http://localhost:8080/api/v1/kakao/callback

  naver:
    client:
      id: ${NAVER_ID}
      secret: ${NAVER_SECRET}
    uri:
      redirect: http://localhost:8080/api/v1/naver/callback